name: Docs

on:
  push:
    branches:
      - main
  pull_request:

# The build and the deploy are two jobs on purpose. A pull request must
# get the documentation *checked* -- that is where a broken docstring is
# cheap to fix -- without publishing anything, and a fork's pull request
# has no write token to publish with anyway.
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[doc]

      # -W turns every Sphinx warning into an error, and --keep-going
      # reports all of them rather than stopping at the first. This was
      # only made possible by enabling napoleon: without it the numpydoc
      # sections of every docstring rendered as raw reStructuredText and
      # the build carried 32 warnings nobody ever saw.
      - name: Build the documentation, warnings are errors
        working-directory: docs
        run: sphinx-build -b html . _build/html -W --keep-going

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/_build/html/
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed to push to gh-pages

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[doc]

      - name: Build the documentation
        working-directory: docs
        run: sphinx-build -b html . _build/html -W --keep-going

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          keep_files: false
