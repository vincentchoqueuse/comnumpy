[build-system]
requires = ["setuptools>=64,<75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comnumpy"
version = "1.0.0.dev0"
description = "A Python Library for Communication System Prototyping and Simulation"
authors = [
  { name = "Vincent Choqueuse" },
  { name = "Zahra Hourzadehgharabolagh" },
  { name = "Alexandru Frunza" },
  { name = "Noel Tanguy" },
  { name = "Flavius Miron" },
  { name = "Abraham Sotomayor" },
  { name = "Stephane Azou" }
]
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = [
  # Alpha, not Beta: the version is 1.0.0.dev0 and the public API is
  # still being reshaped, so PyPI should say so where a user looks
  # before installing rather than only in the README.
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
# Floors are the oldest combination CI actually installs and tests (the
# `oldest` job), not the oldest that might work. matplotlib carried no
# constraint at all while `plot_chain_profiling` called `boxplot(
# orientation=...)`, which arrived in 3.10 -- an error a user would have
# met at plotting time and no job would ever have seen, since every other
# job resolves the newest release.
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.10",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "ruff", "pyright"]
doc = ["sphinx", "pydata-sphinx-theme", "sphinxcontrib-mermaid"]
dev = ["comnumpy[test,doc]", "pre-commit"]

[project.urls]
Homepage = "https://github.com/vincentchoqueuse/comnumpy"
Repository = "https://github.com/vincentchoqueuse/comnumpy"
Documentation = "https://vincentchoqueuse.github.io/comnumpy"
BugTracker = "https://github.com/vincentchoqueuse/comnumpy/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
comnumpy = ["core/data/*.csv", "comnumpy.mplstyle", "py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[tool.ruff]
line-length = 160
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
  "E741",  # ambiguous variable names (l, I): common in signal processing notation
]

[tool.coverage.run]
# The src/ path, not the package name. Naming the package (`source` or
# `source_pkgs` = ["comnumpy"]) makes coverage *import* it to find where
# it lives, so everything `comnumpy/__init__` pulls in is already loaded
# when the tracer starts and gets reported as 0%. That made per-file
# numbers depend on test collection order and the total 16 points too
# low: 74.76% against a true 90.59% measured on 2026-08-09.
source = ["src/comnumpy"]

[tool.coverage.report]
# Ratchet threshold (D39): the measured value is the floor, it can only go up.
# Measured 90.59% on 2026-08-09 (unit tests + doctests), with the
# source_pkgs fix above; the 70 that stood here was read off the broken
# measurement.
fail_under = 90

[tool.ruff.lint.per-file-ignores]
# __init__.py files re-export the public API; explicit __all__ comes with D36.
"__init__.py" = ["F401"]
