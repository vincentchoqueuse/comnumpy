name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: pip install ruff pyright

      - name: Ruff lint
        run: ruff check src/ tests/ validation/ examples/

      - name: Pyright strict (D37 ratchet)
        run: |
          pip install -e .
          pyright

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Bare import check
        run: python -c "import comnumpy"

      - name: Run tests and doctests with coverage
        run: pytest --cov --cov-report=term-missing

  # Every other job resolves the newest release of everything, so the
  # floors in pyproject are a promise nothing checks -- and it was false:
  # matplotlib had no constraint while the code called a 3.10 keyword. This
  # job installs the declared floors exactly. If it goes red, either the
  # code gained a dependency on something newer (raise the floor and say
  # so) or the floor was wrong; do not relax the pins to make it pass.
  oldest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the oldest supported dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.26.*" "scipy==1.11.*" "matplotlib==3.10.*"
          pip install --no-deps -e .
          pip install pytest pytest-cov pytest-subtests

      # The pins above are installed with --no-deps, so nothing enforces
      # that they still satisfy the floors in pyproject. pip check does:
      # raise a floor above a pin and this fails instead of passing quietly
      # against versions the project no longer claims to support.
      - name: The pins must still satisfy the declared floors
        run: pip check

      - name: Run tests and doctests
        run: pytest -q

  # Which parts of the tree a pull request touches. `validation` below is
  # the only job expensive enough to be worth skipping, and a change that
  # touches no code cannot move a physical result -- so this exists to
  # keep a documentation-only pull request from paying for it.
  #
  # The failure mode is deliberately one-sided: anything unexpected (no
  # base commit, a failed diff, a push to main) answers "code changed"
  # and the validation runs. Skipping it by accident would be far worse
  # than running it for nothing.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does this touch code, or only prose?
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "not a pull request: running everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! touched=$(git diff --name-only "$BASE" HEAD); then
            echo "could not diff against $BASE: running everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$touched"
          if echo "$touched" | grep -qE '^(src/|validation/|pyproject\.toml|\.github/workflows/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # The D7 layer: each script asserts its comparison against an
  # analytical or published reference, so a green run is a proof that the
  # curves in the figures are the curves the library computes. They are
  # not part of `test` because a failure here means "the physics moved",
  # which is a different conversation from a broken unit test.
  #
  # It is the slowest job by far, and the only one on the critical path:
  # 699 s for the twenty scripts on 2026-08-12, against 50 s for `lint`
  # and 276 s for the slowest `test`. Four of them are 82 % of it --
  # optical_wdm_opticommpy 214 s, core_capacity 138 s, optical_gn_model
  # 118 s, mimo_diversity_ber 98 s -- all Monte-Carlo convergence checks.
  # Hence the `changes` gate above rather than a nightly: every code
  # change still pays for the proof, a documentation change does not.
  # Re-measure this comment when a script is added; it was wrong by a
  # factor of seven before anyone looked.
  validation:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run every validation script
        env:
          MPLBACKEND: Agg
        run: |
          status=0
          for script in validation/*.py; do
            echo "::group::$script"
            python "$script" || { echo "::error::$script failed"; status=1; }
            echo "::endgroup::"
          done
          exit $status

      - name: Upload the figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-figures
          path: validation/figures/
          if-no-files-found: error

  # Separate job on purpose: the examples are the layer that teaches, and
  # they break for reasons unrelated to the unit tests (a renamed block, a
  # dropped keyword). Isolating them keeps the failure readable and does
  # not hide the result of `test`.
  examples:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run the example smoke test
        env:
          MPLBACKEND: Agg
        run: pytest tests/test_examples_run.py -q -rs
