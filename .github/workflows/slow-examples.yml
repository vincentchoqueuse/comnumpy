name: Slow examples

# The nine scripts in `SLOW` are skipped by the smoke test, which is what
# `SLOW` is for: they cost minutes each and a pull request should not wait
# for them. But nothing else ran them either, so for a while nothing ran
# them at all -- and a regression lived there for two commits, invisible.
# `CD_compensation_part1.py` raised `TypeError: 'Constellation' object is
# not subscriptable` on its first pass and every check stayed green.
#
# So they run here instead: once a week, and on demand. Weekly is the
# right cadence for a guard against drift rather than against a specific
# change -- the whole set is about 15 minutes of runner time, and a
# failure names the script and the traceback.

on:
  schedule:
    - cron: "17 4 * * 1"      # Monday, 04:17 UTC
  workflow_dispatch:
    inputs:
      example:
        description: "Substring of one example to run; empty runs all of them"
        required: false
        default: ""

jobs:
  slow-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run the examples the smoke test skips
        env:
          MPLBACKEND: Agg
          ONLY: ${{ inputs.example }}
        run: python .github/scripts/run_slow_examples.py
