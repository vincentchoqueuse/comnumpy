[build-system]
requires = ["setuptools>=64,<75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comnumpy"
version = "1.0.0.dev0"
description = "A Python Library for Communication System Prototyping and Simulation"
authors = [
  { name = "Vincent Choqueuse" },
  { name = "Zahra Hourzadehgharabolagh" },
  { name = "Alexandru Frunza" },
  { name = "Noel Tanguy" },
  { name = "Flavius Miron" },
  { name = "Abraham Sotomayor" },
  { name = "Stephane Azou" }
]
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "ruff", "pyright"]
doc = ["sphinx", "pydata-sphinx-theme", "sphinxcontrib-mermaid"]
dev = ["comnumpy[test,doc]", "pre-commit"]

[project.urls]
Homepage = "https://github.com/vincentchoqueuse/comnumpy"
Repository = "https://github.com/vincentchoqueuse/comnumpy"
Documentation = "https://vincentchoqueuse.github.io/comnumpy"
BugTracker = "https://github.com/vincentchoqueuse/comnumpy/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
comnumpy = ["core/data/*.csv", "comnumpy.mplstyle"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
doctest_optionflags = ["NORMALIZE_WHITESPACE"]

[tool.ruff]
line-length = 160
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
  "E741",  # ambiguous variable names (l, I): common in signal processing notation
]

[tool.coverage.run]
source = ["comnumpy"]

[tool.coverage.report]
# Ratchet threshold (D39): the measured value is the floor, it can only go up.
# Measured 31.60% on 2026-08-08 (unit tests + doctests).
fail_under = 31

[tool.ruff.lint.per-file-ignores]
# __init__.py files re-export the public API; explicit __all__ comes with D36.
"__init__.py" = ["F401"]
